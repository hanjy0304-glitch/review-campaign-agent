<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>체험단 에이전트 수집기 설정</title>
  <style>
    body { font: 15px/1.6 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin: 16px 8px 0 0; padding: 8px 16px; }
    #status { margin-top: 20px; padding: 12px; background: #f3f4f6; border-radius: 6px; white-space: pre-wrap; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>체험단 에이전트 수집기</h1>
  <p><small>이 값들은 이 컴퓨터의 크롬에만 저장됩니다. 사이트 아이디·비밀번호는 입력하지 않습니다 (크롬에서 평소처럼 로그인해 두세요).</small></p>
  <label for="token">Notion 연동 토큰</label>
  <input id="token" type="password" autocomplete="off" placeholder="secret_… 또는 ntn_…">
  <label for="db">Notion 체험단 관리 표 주소</label>
  <input id="db" type="text" placeholder="https://www.notion.so/…">
  <button id="save">저장</button><button id="run">지금 수집</button>
  <div id="status">상태: 아직 실행 전</div>
  <script src="options.js"></script>
</body>
</html>

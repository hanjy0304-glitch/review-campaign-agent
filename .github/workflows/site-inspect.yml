name: 사이트 화면 구조 확인

# 두 가지 방법으로 실행됩니다.
# 1) Actions 탭 → "사이트 화면 구조 확인" → Run workflow (주소 칸에 입력)
# 2) config/inspect_targets.txt 를 고쳐 push 하면 목록의 주소를 자동 확인 (개발용)
# 로그인 없이 볼 수 있는 공개 페이지의 폼·입력칸·로그인 링크만 요약해 로그에 보여 줍니다.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소 (예: https://reviewnote.co.kr/)"
        type: string
        default: "https://reviewnote.co.kr/"
  push:
    branches: ["claude/**"]
    paths: ["config/inspect_targets.txt"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            python -m review_campaign_agent inspect "$TARGET_URL"
          else
            grep -v '^#' config/inspect_targets.txt | grep -v '^$' | while read -r url; do
              echo "=== $url"
              python -m review_campaign_agent inspect "$url" || true
            done
          fi

name: 사이트 접속 확인

# GitHub 의 Actions 탭 → 왼쪽 "사이트 접속 확인" → Run workflow 버튼으로 실행합니다.
# 로그인 없이 체험단 사이트 첫 화면에 접속되는지만 확인합니다 (해외 IP 차단 여부 점검).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m review_campaign_agent probe

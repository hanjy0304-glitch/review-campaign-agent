name: 연결 확인

# GitHub 의 Actions 탭 → 왼쪽 "연결 확인" → Run workflow 버튼으로 실행합니다.
# 설치나 터미널 없이 텔레그램·Notion 연결을 확인하고 표를 만들 수 있습니다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "무엇을 할까요?"
        type: choice
        default: telegram-chat-id
        options:
          - telegram-chat-id   # 1) 내 텔레그램 chat_id 찾기 (봇에게 먼저 메시지를 보내 두세요)
          - telegram-test      # 2) 텔레그램 테스트 메시지 보내기
          - notion-init        # 3) Notion 에 체험단 관리 표 만들기 (아래 링크 칸을 채우세요)
          - notion-check       # 4) Notion 표를 읽고 오늘 알림을 미리보기 (보내지 않음)
      notion_parent:
        description: "notion-init 일 때만: 표를 만들 Notion 페이지 링크"
        type: string
        default: ""

jobs:
  connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_CONFIG: ${{ secrets.USER_CONFIG }}
          ACTION: ${{ inputs.action }}
          NOTION_PARENT: ${{ inputs.notion_parent }}
        run: |
          # 입력값은 환경변수로만 받아 쉘 명령에 직접 끼워 넣지 않는다 (명령 주입 방지)
          case "$ACTION" in
            telegram-chat-id) python -m review_campaign_agent telegram-chat-id ;;
            telegram-test)    python -m review_campaign_agent telegram-test ;;
            notion-init)
              if [ -z "$NOTION_PARENT" ]; then
                echo "Notion 페이지 링크 칸을 채워 주세요."; exit 1
              fi
              python -m review_campaign_agent notion-init --parent "$NOTION_PARENT" ;;
            notion-check)     python -m review_campaign_agent run --dry-run --summary ;;
            *) echo "알 수 없는 동작: $ACTION"; exit 1 ;;
          esac

# 사용자별 설정 예시. 복사해서 config/user.yaml 로 만들어 쓰세요 (gitignore됨).
# 또는 `python -m review_campaign_agent setup` 으로 질문에 답하며 자동 생성할 수 있습니다.
# GitHub Actions에서는 이 파일 대신 저장소 Secret 의 USER_CONFIG 에 같은 내용을 붙여넣습니다.
# (블로그·인스타 주소는 개인 식별 정보라서 Variables 가 아니라 Secret 에 넣습니다. 로그에 찍히지 않습니다.)
# 아이디/비밀번호/토큰은 여기에 쓰지 않습니다. → .env 또는 GitHub Secrets
#
# 날짜 계산은 항상 한국시간(Asia/Seoul) 기준입니다.
# 점검 시각은 이 파일이 아니라 .github/workflows 의 cron 에서 정합니다.

# 내가 활동하는 채널 (참고용 메타데이터)
channels:
  blog:
    url: https://blog.naver.com/your-blog-id   # 예시 값. 본인 것으로 교체
  instagram:
    url: https://www.instagram.com/your-account/   # 예시 값. 안 쓰면 이 항목 삭제

# 내가 쓰는 체험단 사이트만 고르세요 (config/sites.yaml 의 key 중 선택).
# `python -m review_campaign_agent setup` 을 실행하면 목록에서 체크해서 이 항목을 자동으로 채워줍니다.
enabled_sites:
  - example_site_a
  - example_site_b

# 카탈로그에 없는 사이트는 직접 추가 (자동 수집은 어댑터 작성 필요, 없으면 수동 입력 모드)
custom_sites: []
#  - key: mysite
#    name: 내 체험단 사이트
#    domain: example.co.kr

notify:
  deadline_reminders_days: [3, 1, 0]   # 글 마감 D-3, D-1, D-day
  visit_reminders_days: [1, 0]         # 방문일 D-1, D-day (방문일은 Notion 에 직접 입력)
  daily_summary: true

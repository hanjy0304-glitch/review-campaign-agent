# 사용자별 설정 예시. 복사해서 config/user.yaml 로 만들어 쓰세요 (gitignore됨).
# GitHub Actions에서는 이 파일 대신 저장소 Variables 의 USER_CONFIG 에 같은 내용을 붙여넣습니다.
# 아이디/비밀번호/토큰은 여기에 쓰지 않습니다. → .env 또는 GitHub Secrets

# 내가 활동하는 채널 (참고용 메타데이터)
channels:
  blog:
    platform: naver        # naver | tistory | other
    url: https://blog.naver.com/your-blog-id   # 예시 값. 본인 것으로 교체
  instagram:
    url: https://www.instagram.com/your-account/   # 예시 값. 안 쓰면 이 항목 삭제

timezone: Asia/Seoul

# 내가 쓰는 체험단 사이트만 고르세요 (config/sites.yaml 의 key 중 선택).
# `python -m setup` 을 실행하면 목록에서 체크해서 이 항목을 자동으로 채워줍니다.
enabled_sites:
  - example_site_a
  - example_site_b

# 카탈로그에 없는 사이트는 직접 추가 (어댑터 작성 필요, CONTRIBUTING 참고)
custom_sites: []

notify:
  run_times: ["09:00", "18:00"]   # 점검 시각 (로컬 시간)
  deadline_reminders_days: [3, 1, 0]   # 마감 D-3, D-1, D-day
  daily_summary: true

# 지원 체험단 사이트 카탈로그. 공개 정보만 기재 (계정·비밀번호·개인 URL 금지).
# domain_source: 도메인을 알게 된 근거. user = 사용자가 직접 제공, search = 웹 검색 결과(직접 접속 테스트 아님),
#                adapter_tested = 어댑터로 실제 접속 확인됨
# adapter: none | experimental | stable  (자동 수집 지원 수준. none 이면 Notion에 직접 입력해도 마감 알림은 동일하게 제공)
#   자동 수집은 현재 크롬 확장(extension/) 방식이다. 새 사이트 추가 절차는 docs/add-site.md 참고.
# login_type: unknown | id_pw | naver | kakao | mixed  (사이트별로 확인되면 기재)
# my_applications_url: 로그인 후 "내 신청/선정 내역" 페이지 경로 (확인 후 기재)
# 환경변수 이름은 key 를 대문자로 + _ID / _PW (예: ASSAVIEW_ID). .env.example 참고.

sites:
  - key: gangnam
    name: 강남맛집
    domain: gangnam-review.net
    domain_source: adapter_tested   # 2026-11-06 공개 페이지 실제 접속 확인(확장 실행은 아직): gangnam-review.net → 강남맛집.net(punycode xn--939au0g4vj8sq.net) 301. 목록 /cp/, 상세 /cp/?id=번호, 로그인 /bbs/login.php, 마이페이지 /theme/go/mypage/
    adapter: experimental   # 크롬 확장이 마이페이지('나의 캠페인')를 읽음. 2026-11-06 공개 캠페인 목록 카드 구조(/cp/ 목록과 #c_box ul li .textArea) 기반 파서, 로그인 화면 실측은 아직
    login_type: mixed       # 로그인 페이지(/bbs/login.php)에 아이디·비밀번호(mb_id·mb_password) + 카카오·네이버·구글 소셜 버튼 확인 (2026-11-06, 공개 페이지)
    my_applications_url: /theme/go/mypage/   # 확장이 읽는 마이페이지. 비로그인으로 열면 alert 뒤 /bbs/login.php 로 replace 된다(2026-11-06 확인)
    id_env: GANGNAM_ID
    pw_env: GANGNAM_PW

  - key: reviewnote
    name: 리뷰노트
    domain: reviewnote.co.kr
    domain_source: search   # 앱스토어/플레이스토어 홈페이지 주소와 일치
    adapter: experimental   # 크롬 확장(extension/)이 '진행중' 목록을 읽어 Notion에 저장. 2026-10-18 실제 화면→Notion 저장 확인
    login_type: mixed       # 로그인 화면(/sns/login)에 네이버·Apple 버튼만 확인됨. 아이디/비번 입력칸 없음 (Actions 브라우저로 확인)
    my_applications_url: /users/my_campaign?menuLayout=true&tab=ongoing   # 확장이 읽는 '내 체험단 > 진행중' 화면
    id_env: REVIEWNOTE_ID
    pw_env: REVIEWNOTE_PW

  - key: dinnerqueen
    name: 디너의여왕
    domain: dinnerqueen.net
    domain_source: search   # 플레이스토어 공식 웹사이트 표기
    adapter: experimental # 크롬 확장이 마이페이지('나의캠페인' 위젯)를 읽음. 2026-11-01 공개 카드 구조 기반 파서, 로그인 화면 실측은 아직
    login_type: mixed       # 로그인 페이지(/login/form_new)에 아이디·비밀번호 + 네이버·카카오·Apple·Google 확인 (2026-10-30, 공개 페이지)
    my_applications_url: /mypage/widget   # 확장이 읽는 마이페이지. 비로그인으로 열면 메인으로 리다이렉트됨(2026-11-01 확인)
    id_env: DINNERQUEEN_ID
    pw_env: DINNERQUEEN_PW

  - key: reviewplace
    name: 리뷰플레이스
    domain: reviewplace.co.kr
    domain_source: search   # 앱스토어 등록 정보
    adapter: experimental # 크롬 확장이 마이페이지('선정된 캠페인')를 읽음. 2026-11-09 사용자 실측 URL 반영
    login_type: mixed       # 로그인 페이지(/bbs/login.php)에 아이디·비밀번호 + 네이버·Apple 소셜 링크 확인 (2026-10-30, 공개 페이지)
    my_applications_url: /my/cmp_select.php   # 확장이 읽는 마이페이지('선정된 캠페인'). 비로그인으로 열면 로그인 화면으로 넘어감(2026-11-09 확인)
    id_env: REVIEWPLACE_ID
    pw_env: REVIEWPLACE_PW

  - key: mible
    name: 미블
    domain: mrblog.net
    domain_source: search   # 메인 페이지 확인. 가입은 SNS 간편가입 안내 있음
    adapter: none
    login_type: mixed       # 로그인 페이지(/login)에 아이디·비밀번호 + 네이버·Apple 'SNS로 간편하게' 확인 (2026-10-30, 공개 페이지)
    my_applications_url: null
    id_env: MIBLE_ID
    pw_env: MIBLE_PW

  - key: chvu
    name: 체험뷰
    domain: chvu.co.kr
    domain_source: search   # 메인 페이지 확인
    adapter: none
    login_type: mixed       # 로그인 페이지(/login)에 비밀번호 칸과 네이버 로그인 SDK 확인. SNS 버튼 노출 여부는 미확인 (2026-10-30, 공개 페이지)
    my_applications_url: null
    id_env: CHVU_ID
    pw_env: CHVU_PW

  - key: popomon
    name: 포포몬
    domain: popomon.com
    domain_source: adapter_tested   # 2026-11-09 공개 페이지·로그인 리다이렉트 실제 접속 확인: popomon.com, /next/login, 마이페이지 /next/mypage
    adapter: experimental   # 크롬 확장이 마이페이지(/next/mypage)를 읽음. /next/campaign/:id 카드 구조 기반 파서
    login_type: mixed       # 로그인 페이지(/next/login)에 아이디·비밀번호 + 소셜 간편 로그인
    my_applications_url: /next/mypage   # 확장이 읽는 마이페이지. 비로그인으로 열면 /next/login?return=... 로 리다이렉트됨 (2026-11-09 확인)
    id_env: POPOMON_ID
    pw_env: POPOMON_PW

  - key: assaview
    name: 아싸뷰
    domain: assaview.co.kr
    domain_source: search   # 로그인 페이지에 네이버/카카오/Apple + 아이디·비번 (assaview.co.kr/login.php)
    adapter: none
    login_type: mixed
    my_applications_url: null
    id_env: ASSAVIEW_ID
    pw_env: ASSAVIEW_PW

  - key: supermembers
    name: 슈퍼멤버스
    domain: supermembers.co.kr
    domain_source: search   # 블로거 로그인 페이지 supermembers.co.kr/signin/. 광고주 로그인과 별개
    adapter: none
    login_type: unknown
    my_applications_url: null
    id_env: SUPERMEMBERS_ID
    pw_env: SUPERMEMBERS_PW

  - key: revu
    name: 레뷰
    domain: revu.net
    domain_source: search   # 앱스토어 홈페이지 주소. 광고주용은 biz.revu.net
    adapter: none
    login_type: unknown
    my_applications_url: null

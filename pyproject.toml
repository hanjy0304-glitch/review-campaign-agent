[project]
name = "review-campaign-agent"
version = "0.1.0"
description = "Blog & Instagram 체험단 (review campaign) tracker: selection results and post deadlines from multiple sites, Telegram alerts, Notion sync."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "tzdata", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["review_campaign_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
